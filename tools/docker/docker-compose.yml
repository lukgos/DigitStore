services:

  api:
    profiles:
      - docker
    build:
      context: ../../
      dockerfile: src/Bootstrapper/DigitStore.Api/Dockerfile
    container_name: shop_api
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=ShopDb;Username=postgres;Password=password
      OpenSearch__Url: http://opensearch:9200
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Port: 5672
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      Serilog__WriteTo__1__Args__serverUrl: http://seq:5341
    ports:
      - "5000:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      opensearch:
        condition: service_started
    networks:
      - shop-network

  postgres:
    image: postgres:18
    container_name: shop_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ShopDb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ShopDb"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - shop-network

  opensearch:
    image: opensearchproject/opensearch:3.8.0
    container_name: shop_opensearch
    environment:
      discovery.type: single-node
      bootstrap.memory_lock: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
      DISABLE_SECURITY_PLUGIN: "true"
    ports:
      - "9200:9200"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    networks:
      - shop-network

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:latest
    container_name: shop_opensearch_dashboards
    ports:
      - "5601:5601"
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
    depends_on:
      - opensearch
    networks:
      - shop-network

  rabbitmq:
    image: rabbitmq:4.3.5-management
    container_name: shop_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - shop-network

  seq:
    image: datalust/seq:2026.1
    container_name: shop_seq
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_ADMINPASSWORD: "Password123!"
    ports:
      - "5341:80"
    volumes:
      - seq_data:/data
    networks:
      - shop-network

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: shop_jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "4317:4317"
    networks:
      - shop-network

  prometheus:
    image: prom/prometheus:latest
    container_name: shop_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - shop-network

  grafana:
    image: grafana/grafana:latest
    container_name: shop_grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - shop-network

volumes:
  postgres_data:
  opensearch_data:
  rabbitmq_data:
  seq_data:
  prometheus_data:
  grafana_data:

networks:
  shop-network:
    driver: bridge